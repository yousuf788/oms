# Workspace-level Cargo configuration.
# Sets environment variables required to build rusteron-client (Aeron) on Ubuntu
# without needing pkg-config installed (uses explicit OpenSSL paths + local lib symlinks).
#
# The lib symlinks are created by: mkdir -p /tmp/oms-libs
#   ln -sf /usr/lib/x86_64-linux-gnu/libuuid.so.1.3.0 /tmp/oms-libs/libuuid.so
#   ln -sf /usr/lib/x86_64-linux-gnu/libbsd.so.0.11.5  /tmp/oms-libs/libbsd.so
# These must exist before cargo build (run scripts/install-aeron-deps.sh).

[env]
OPENSSL_DIR = "/usr"
OPENSSL_LIB_DIR = "/usr/lib/x86_64-linux-gnu"
OPENSSL_INCLUDE_DIR = "/usr/include"

[build]
rustflags = ["-L", "/tmp/oms-libs"]
