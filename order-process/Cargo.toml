[package]
name = "order-process"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "order-process"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
socket2 = "0.5"
rand = "0.8"
dotenvy = "0.15"
rusteron-client = { version = "0.2", features = ["static", "precompile"] }
hmac = "0.12"
sha2 = "0.10"
crossbeam-channel = "0.5"
